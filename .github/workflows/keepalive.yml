name: Render Backend Keep-Alive

on:
  schedule:
    # Trigger every 10 minutes to prevent Render free-tier instance from sleeping (spins down after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Speakly Cloud Health Endpoint
        env:
          TARGET_URL: ${{ vars.SPEAKLY_BACKEND_URL || 'https://speakly-backend.onrender.com' }}
        run: |
          HEALTH_URL="${TARGET_URL%/}/health"
          echo "Pinging: $HEALTH_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$HEALTH_URL" || echo "000")
          echo "Render Health Ping HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Speakly Backend is awake, warm and healthy."
          else
            echo "⚠️ Backend ping returned status $STATUS (instance may be cold-booting or deploying)."
          fi
