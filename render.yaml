services:
  - type: web
    name: speakly-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SPEAKLY_CLIENT_SECRET
        generateValue: true

  - type: web
    name: speakly-website
    runtime: static
    rootDir: website
    buildCommand: ""
    staticPublishPath: .
