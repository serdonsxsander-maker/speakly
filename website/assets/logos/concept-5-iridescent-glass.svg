<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title-c5 desc-c5">
  <title id="title-c5">Speakly Concept 5 — Iridescent Frosted Glass Ducky</title>
  <desc id="desc-c5">Translucent Apple VisionOS style frosted glass rubber ducky with warm amber refraction on titanium silver.</desc>
  <defs>
    <linearGradient id="c5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="c5-duck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="c5-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Frosted Titanium Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#c5-bg)" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Iridescent Aura Orbs -->
  <circle cx="65" cy="35" r="20" fill="#6366F1" opacity="0.18"/>
  <circle cx="35" cy="68" r="22" fill="#F59E0B" opacity="0.22"/>
  <!-- Beak -->
  <path d="M20 40 Q10 42 14 48 Q23 50 28 45 Z" fill="#EA580C"/>
  <!-- Main Duck Silhouette -->
  <ellipse cx="53" cy="62" rx="26" ry="19" fill="url(#c5-duck)"/>
  <path d="M74 53 C84 43, 88 47, 78 62 Z" fill="url(#c5-duck)"/>
  <circle cx="38" cy="40" r="17.5" fill="url(#c5-duck)"/>
  <!-- Translucent Glass Wing Overlay -->
  <path d="M40 56 Q54 46 69 58 Q57 74 40 69 Z" fill="url(#c5-glass)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Crisp Eye -->
  <circle cx="34" cy="37" r="3.5" fill="#0F172A"/>
  <circle cx="32.8" cy="35.8" r="1.3" fill="#FFFFFF"/>
</svg>
